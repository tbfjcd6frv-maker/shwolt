<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShWolt — помощь электрика</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 16px;
      max-width: 480px;
      margin: auto;
      background: #f7f7f7;
    }

    h1 {
      font-size: 22px;
    }

    input, textarea, button {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      background: #111;
      color: #fff;
      border: none;
      border-radius: 6px;
    }
  </style>
</head>

<body>

<h1>Онлайн-помощь электрика ShWolt</h1>
<p>Опишите проблему и прикрепите фото</p>

<form id="form">
  <input id="name" placeholder="Имя" required>
  <input id="phone" placeholder="Телефон" required>
  <textarea id="text" placeholder="Опишите проблему" required></textarea>
  <input type="file" id="photo" accept="image/*">
  <button type="submit">Отправить</button>
</form>

<script>
const TOKEN = "8415161988:AAFRk2DR3VI6cxP_Kr376nyb0mKipUloAg0";
const CHAT_ID = "5601445926";

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();

  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;
  const text = document.getElementById("text").value;
  const photo = document.getElementById("photo").files[0];

  const caption =
    "🧑 Имя: " + name + "\n" +
    "📞 Телефон: " + phone + "\n\n" +
    "🔧 Проблема:\n" + text;

  if (photo) {
    const formData = new FormData();
    formData.append("chat_id", CHAT_ID);
    formData.append("caption", caption);
    formData.append("photo", photo);

    await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, {
      method: "POST",
      body: formData
    });
  } else {
    await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        chat_id: CHAT_ID,
        text: caption
      })
    });
  }

  alert("Заявка отправлена!");
  document.getElementById("form").reset();
});
</script>

</body>
</html>
