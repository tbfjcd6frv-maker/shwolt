<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShWolt — помощь электрика</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#111111">

<style>
* {
  box-sizing: border-box;
}
body {
  font-family: Arial, sans-serif;
  padding: 16px;
  max-width: 480px;
  margin: auto;
  background: linear-gradient(180deg, #0f0f0f, #1c1c1c);
  color: #fff;
}

h1 {
  font-size: 24px;
  margin-bottom: 10px;
  color: #FFD400;
}

p {
  font-size: 15px;
  margin-bottom: 16px;
  opacity: 0.9;
}

input, textarea {
  width: 100%;
  margin-top: 10px;
  padding: 12px;
  font-size: 16px;
  border-radius: 10px;
  border: 1px solid #ddd;
}

button {
  margin-top: 14px;
  background: linear-gradient(135deg, #FFD400, #FF9900);
  color: #000;
  border: none;
  border-radius: 12px;
  font-weight: bold;
  padding: 14px;
  font-size: 16px;
}

.card {
  background: #ffffff;
  color: #111;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 16px;
}
</style>
</head>

<body>

<h1>⚡ Электрик в кармане</h1>
<p>Фото → анализ → чёткое решение без риска</p>

<div class="card">
<form id="form">
  <input id="name" placeholder="Имя" required>
  <input id="phone" placeholder="Телефон" required>
  <textarea id="text" placeholder="Опишите проблему" required></textarea>
  <input type="file" id="photo" accept="image/*" required>
 <button type="submit">⚡ Получить решение</button>
</form>
</div>

<script>
const TOKEN = "8415161988:AAFRk2DR3VI6cxP_Kr376nyb0mKipUloAg0";
const CHAT_ID = "5601445926";

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (localStorage.getItem("used")) {
  alert("⚡ Первый вопрос бесплатный.\n\nДальше — доступ по подписке.\nБез выезда и лишних трат.");
  return;
}localStorage.setItem("used", "true");

  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;
  const text = document.getElementById("text").value;
  const photo = document.getElementById("photo").files[0];

  const caption =
    "🧑 Имя: " + name + "\n" +
    "📞 Телефон: " + phone + "\n\n" +
    "🔧 Проблема:\n" + text;

  // 1️⃣ Отправляем заявку ТЕБЕ
  const formData = new FormData();
  formData.append("chat_id", CHAT_ID);
  formData.append("caption", caption);
  formData.append("photo", photo);

  await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, {
    method: "POST",
    body: formData
  });

  // 2️⃣ Автоответ (подтверждение)
  await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      chat_id: CHAT_ID,
      text:
        "✅ Заявка принята\n\n" +
        "Я изучу фото и описание и отвечу вам в ближайшее время.\n\n" +
        "— ShWolt ⚡"
    })
  });

  alert("Заявка отправлена! Спасибо за ваше доверие. С уважением ShWolt!");
  document.getElementById("form").reset();
});
</script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
