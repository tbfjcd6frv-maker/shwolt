<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShWolt — помощь электрика</title>

<style>
body {
  font-family: Arial, sans-serif;
  padding: 16px;
  max-width: 480px;
  margin: auto;
  background: #f4f4f4;
}

h1 {
  font-size: 22px;
}

input, textarea, button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  font-size: 16px;
  box-sizing: border-box;
}

button {
  background: linear-gradient(135deg, #facc15, #f97316);
  color: #111;
  border: none;
  border-radius: 8px;
  font-weight: bold;
}

/* PAYWALL */
#paywall {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.85);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

.paywall-box {
  background: linear-gradient(135deg, #1e293b, #020617);
  color: white;
  padding: 24px;
  border-radius: 16px;
  max-width: 360px;
  width: 100%;
}

.paywall-box h2 {
  margin-top: 0;
}

.paywall-box button {
  background: linear-gradient(135deg, #22c55e, #16a34a);
  color: #fff;
}
</style>
</head>

<body>

<h1>⚡ Онлайн-помощь электрика ShWolt</h1>
<p>Опишите проблему и прикрепите фото</p>

<form id="form">
  <input id="name" placeholder="Имя" required>
  <input id="phone" placeholder="Телефон" required>
  <textarea id="text" placeholder="Опишите проблему" required></textarea>
  <input type="file" id="photo" accept="image/*" required>
  <button type="submit">⚡ Получить решение</button>
</form>

<!-- PAYWALL -->
<div id="paywall">
  <div class="paywall-box">
    <h2>⚡ Доступ к помощи электрика</h2>
    <p>Я лично разберу фото и дам конкретное решение.</p>

    <ul>
      <li>📸 Анализ фото</li>
      <li>🧠 Чёткий план действий</li>
      <li>⚠️ Предупреждение об ошибках</li>
      <li>💬 Ответ в Telegram</li>
    </ul>

    <p><b>Стоимость: 499 ₽</b></p>
    <p style="font-size:13px; opacity:0.7;">Выезд электрика от 3000 ₽</p>

    <button onclick="sendToTelegram()">🔓 Получить доступ</button>
  </div>
</div>

<script>
const TOKEN = "8415161988:AAFRk2DR3VI6cxP_Kr376nyb0mKipUloAg0";
const CHAT_ID = "5601445926";

let formCache = {};

document.getElementById("form").addEventListener("submit", (e) => {
  e.preventDefault();

  formCache = {
    name: name.value,
    phone: phone.value,
    text: text.value,
    photo: photo.files[0]
  };

  document.getElementById("paywall").style.display = "flex";
});

async function sendToTelegram() {
  const caption =
    "🧑 Имя: " + formCache.name + "\n" +
    "📞 Телефон: " + formCache.phone + "\n\n" +
    "🔧 Проблема:\n" + formCache.text;

  const fd = new FormData();
  fd.append("chat_id", CHAT_ID);
  fd.append("caption", caption);
  fd.append("photo", formCache.photo);

  await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, {
    method: "POST",
    body: fd
  });

  alert("✅ Заявка отправлена!");
  document.getElementById("paywall").style.display = "none";
  document.getElementById("form").reset();
}
</script>

</body>
</html>
