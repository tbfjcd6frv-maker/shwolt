<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShWolt🔋 — помощь электрика</title>

<style>
body {
  font-family: Arial, sans-serif;
  padding: 16px;
  max-width: 480px;
  margin: auto;
  background: #f4f4f4;
}

h1 { font-size: 22px; }

input, textarea, select {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  border-radius: 12px;
  border: 2px solid #e5e5e5;
  box-sizing: border-box;
}

button {
  width: 100%;
  padding: 18px;
  font-size: 18px;
  font-weight: 800;
  border-radius: 14px;
  background: linear-gradient(135deg, #facc15, #f97316);
  border: none;
  color: #111;
}

/* HERO */
.hero {
  background: linear-gradient(135deg, #111827, #020617);
  color: #fff;
  padding: 24px;
  border-radius: 20px;
  margin-bottom: 20px;
  text-align: center;
}

.hero-price .old {
  color: #ff6b6b;
  text-decoration: line-through;
}

.hero-price .new {
  color: #22c55e;
  font-size: 20px;
  font-weight: 800;
}

/* PAYWALL */
#paywall {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

.paywall-box {
  background: linear-gradient(135deg, #1e293b, #020617);
  color: white;
  padding: 24px;
  border-radius: 16px;
  max-width: 360px;
  width: 100%;
}
</style>
</head>

<body>

<!-- HERO -->
<div class="hero">
  <h1>⚡ Электрик онлайн</h1>
  <p class="hero-sub">Разберу вашу проблему по фото и подскажу, что делать</p>

  <div class="hero-price">
    <span class="old">Выезд — 3000 ₽</span>
    <span class="new">Онлайн сейчас — 499 ₽</span>
  </div>

  <p class="hero-status">🟢 Сейчас онлайн</p>
</div>

<h1>Онлайн-помощь электрика ShWolt</h1>
<p style="font-size:14px;color:#555;">👋 Отвечаю лично, не бот</p>

<form id="form">
  <input id="name" placeholder="Имя" required>
  <input id="phone" placeholder="Телефон" required>

  <label>Способ связи</label>
  <select id="contact" required>
    <option value="">Выберите</option>
    <option value="Сотовый">📱 Сотовый</option>
    <option value="WhatsApp">💬 WhatsApp</option>
    <option value="Telegram">✈️ Telegram</option>
  </select>

  <textarea id="text" placeholder="Опишите проблему" required></textarea>
  <input type="file" id="photo" accept="image/*" required>

  <button type="button" onclick="dangerMode()" style="background:#dc2626;color:#fff;margin-top:10px;">
    ⚠️ ОПАСНО / ИСКРИТ / ПАХНЕТ
  </button>

  <button type="submit">⚡ Получить решение</button>
</form>

<!-- PAYWALL -->
<div id="paywall">
  <div class="paywall-box">
    <h2>Выберите формат помощи</h2>

    <select id="package" required>
      <option value="">Выберите пакет</option>
      <option value="🟢 Быстрый совет — 499 ₽">🟢 Быстрый совет — 499 ₽</option>
      <option value="🔵 Разбор + схема — 999 ₽">🔵 Разбор + схема — 999 ₽</option>
      <option value="🔴 Срочно — 1499 ₽">🔴 Срочно — 1499 ₽</option>
    </select>

    <button onclick="sendToTelegram()" style="margin-top:14px;background:#22c55e;color:#fff;">
      🔓 Получить доступ
    </button>
  </div>
</div>

<!-- SUCCESS -->
<div id="success" style="display:none;position:fixed;inset:0;background:#020617;color:#fff;text-align:center;padding:40px;">
  <h2>✅ Заявка принята</h2>
  <p>Свяжусь с вами через <b id="success-contact"></b></p>
</div>

<script>
const TOKEN = "8415161988:AAFRk2DR3VI6cxP_Kr376nyb0mKipUloAg0";
const CHAT_ID = "5601445926";

const paywall = document.getElementById("paywall");
const success = document.getElementById("success");
const form = document.getElementById("form");

let isDanger = false;
let cache = {};

form.onsubmit = (e) => {
  e.preventDefault();

  cache = {
  name: document.getElementById("name").value,
  phone: document.getElementById("phone").value,
  contact: document.getElementById("contact").value,
  text: document.getElementById("text").value,
  photo: document.getElementById("photo").files[0]
};

  if (!cache.contact) {
    alert("Выберите способ связи");
    return;
  }

  paywall.style.display = "flex";
};

function dangerMode() {
  isDanger = true;

  cache = {
  name: document.getElementById("name").value,
  phone: document.getElementById("phone").value,
  contact: document.getElementById("contact").value,
  text: document.getElementById("text").value,
  photo: document.getElementById("photo").files[0]
};

  if (!cache.contact) {
    alert("Выберите способ связи");
    return;
  }

  document.getElementById("package").value =
    "🔴 Срочно (10 минут) — 1499 ₽";

  paywall.style.display = "flex";
}

async function sendToTelegram() {
  cache.package = document.getElementById("package").value;

  if (!cache.package) {
    alert("Выберите пакет помощи");
    return;
  }

  const fd = new FormData();
  fd.append("chat_id", CHAT_ID);

  const dangerText = isDanger ? "🚨 РЕЖИМ: ОПАСНО\n" : "";

  fd.append(
    "caption",
`${dangerText}
🧑 Имя: ${cache.name}
📞 Телефон: ${cache.phone}
📲 Связь: ${cache.contact}
💼 Пакет: ${cache.package}

🔧 Проблема:
${cache.text}`
  );

  fd.append("photo", cache.photo);

  await fetch(`https://api.telegram.org/bot${TOKEN}/sendPhoto`, {
    method: "POST",
    body: fd
  });

  paywall.style.display = "none";
  success.style.display = "block";
  document.getElementById("success-contact").innerText = cache.contact;

  form.reset();
  isDanger = false;
}
</script>

</body>
</html>
